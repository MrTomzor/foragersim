# Method comparison: PPO vs Dreamer on the same maze + task.
#
# Cardinality: 1 variation × 2 methods × 3 seeds = 6 runs.
# Each run is 20 stages of 300k steps = 6M.
#
agent_preset: sphereagent_2d_lidar_20m
task_preset: volumetric_exploration_5000_collision_penalty
world_preset: maze_sectored_orthogonal

# Pin the stage size, state the budget; n_stages follows (6M / 300k = 20).
# Authored this way round so raising total_steps later appends stages instead of
# resizing the finished ones -- stage_<i>.done records only *that* stage K
# finished, never how big it was.
steps_per_stage: 300_000
total_steps: 3_000_000
mode: dfs

methods:
  - name: dreamer
  - name: ppo

seeds: 3
